[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Database memakai Postgres/Supabase. Set env DATABASE_URL di
# Site configuration → Environment variables (connection string pooler,
# port 6543). Build tidak membutuhkan akses database.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "npm run dev"
  targetPort = 3000
